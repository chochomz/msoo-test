<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소셜 로그인 테스트 (리디렉션 방식)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#F8F9FA] flex items-center justify-center h-screen w-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-sm p-6 text-center space-y-6">
        <div>
            <h1 class="text-xl font-black text-gray-800">세종꿈의교회 23목장</h1>
            <p class="text-xs text-gray-500 mt-1">소셜 로그인 테스트 페이지</p>
        </div>

        <!-- 로그인 전 화면 -->
        <div id="login-section" class="space-y-4">
            <!-- 구글 로그인 버튼 (팝업 대신 화면 전환 리디렉션 방식 적용) -->
            <button onclick="handleGoogleLogin()" id="google-login-btn" class="w-full py-3 px-4 bg-white hover:bg-gray-50 text-gray-700 font-semibold rounded-xl border border-gray-300 shadow-2xs flex items-center justify-center space-x-3 active:scale-95 transition-all text-xs">
                <i class="fa-brands fa-google text-rose-500 text-sm"></i>
                <span>구글 계정으로 로그인</span>
            </button>

            <!-- 카카오 로그인 버튼 (추후 연동용) -->
            <button onclick="handleKakaoLogin()" class="w-full py-3 px-4 bg-[#FEE500] hover:bg-[#fdd800] text-[#191919] font-bold rounded-xl shadow-2xs flex items-center justify-center space-x-3 active:scale-95 transition-all text-xs">
                <i class="fa-solid fa-comment text-sm"></i>
                <span>카카오 계정으로 로그인</span>
            </button>

            <!-- 자동 로그인 유지 체크박스 -->
            <div class="flex items-center justify-center space-x-2 pt-2">
                <input type="checkbox" id="auto-login-check" checked class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500 cursor-pointer">
                <label for="auto-login-check" class="text-xs text-gray-600 cursor-pointer select-none">로그인 상태 유지 (자동 로그인)</label>
            </div>
        </div>

        <!-- 로그인 후 결과 및 프로필 표시 영역 (초기엔 숨김) -->
        <div id="profile-section" class="hidden space-y-4 text-left bg-gray-50 p-4 rounded-xl border border-gray-200">
            <div class="flex items-center space-x-3">
                <img id="user-avatar" src="" alt="프로필" class="w-12 h-12 rounded-full border border-gray-300 object-cover bg-white">
                <div class="overflow-hidden">
                    <h3 id="user-name" class="font-bold text-sm text-gray-800 truncate">이름</h3>
                    <p id="user-email" class="text-[11px] text-gray-500 truncate">이메일</p>
                </div>
            </div>
            <div class="pt-2 border-t border-gray-200 text-center">
                <button onclick="handleLogout()" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-lg text-xs transition-all">
                    로그아웃
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithRedirect, 
            getRedirectResult,
            GoogleAuthProvider, 
            OAuthProvider, 
            setPersistence, 
            browserLocalPersistence, 
            browserSessionPersistence, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // 사용중이신 기존 테스트용 Firebase 설정 정보
        const firebaseConfig = {
            apiKey: "AIzaSyD3R4-0_BgOvpS9b1NRgD7uKaYYZjFZ5cY",
            authDomain: "msoo-test.firebaseapp.com",
            projectId: "msoo-test",
            storageBucket: "msoo-test.firebasestorage.app",
            messagingSenderId: "790925552449",
            appId: "1:790925552449:web:d078bfd7d3e3e4684d4fc0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        const kakaoProvider = new OAuthProvider('oidc.kakao');

        // [핵심] 로그인 상태 유지 체크박스 연동 함수
        async function applyPersistenceSetting() {
            const isAutoLogin = document.getElementById('auto-login-check').checked;
            const persistenceType = isAutoLogin ? browserLocalPersistence : browserSessionPersistence;
            await setPersistence(auth, persistenceType);
        }

        // 구글 로그인 실행 함수 (팝업 대신 페이지 전환 리디렉션 방식 적용)
        window.handleGoogleLogin = async function() {
            try {
                const btn = document.getElementById('google-login-btn');
                if (btn) {
                    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-emerald-600 text-sm"></i><span>구글 로그인 페이지로 이동 중...</span>`;
                    btn.disabled = true;
                }
                await applyPersistenceSetting();
                // 팝업창 대신 현재 브라우저 창이 구글 로그인 화면으로 자연스럽게 전환됩니다.
                await signInWithRedirect(auth, googleProvider);
            } catch (error) {
                console.error("구글 로그인 에러:", error);
                alert("구글 로그인 실패: " + error.message);
                const btn = document.getElementById('google-login-btn');
                if (btn) {
                    btn.innerHTML = `<i class="fa-brands fa-google text-rose-500 text-sm"></i><span>구글 계정으로 로그인</span>`;
                    btn.disabled = false;
                }
            }
        };

        // 카카오 로그인 실행 함수
        window.handleKakaoLogin = async function() {
            try {
                await applyPersistenceSetting();
                await signInWithRedirect(auth, kakaoProvider);
            } catch (error) {
                console.error("카카오 로그인 에러:", error);
                alert("카카오 로그인 실패: " + error.message);
            }
        };

        // 로그아웃 실행 함수
        window.handleLogout = async function() {
            try {
                await signOut(auth);
                console.log("로그아웃 완료");
            } catch (error) {
                console.error("로그아웃 에러:", error);
            }
        };

        // 페이지가 리디렉션되어 돌아왔을 때 로그인 결과 확인 처리
        getRedirectResult(auth)
            .then((result) => {
                if (result && result.user) {
                    console.log("리디렉션 로그인 성공:", result.user);
                }
            }).catch((error) => {
                console.error("리디렉션 결과 처리 에러:", error);
            });

        // 실시간 인증 상태 감지 (자동 로그인 및 UI 전환 처리)
        onAuthStateChanged(auth, (user) => {
            const loginSection = document.getElementById('login-section');
            const profileSection = document.getElementById('profile-section');
            const userNameEl = document.getElementById('user-name');
            const userEmailEl = document.getElementById('user-email');
            const userAvatarEl = document.getElementById('user-avatar');

            if (user) {
                // 로그인 된 상태 -> 프로필 정보 표시
                loginSection.classList.add('hidden');
                profileSection.classList.remove('hidden');

                userNameEl.innerText = user.displayName || "목장가족";
                userEmailEl.innerText = user.email || "이메일 정보 없음";
                userAvatarEl.src = user.photoURL || "https://via.placeholder.com/150";
            } else {
                // 로그아웃 상태 -> 로그인 버튼 표시
                profileSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
